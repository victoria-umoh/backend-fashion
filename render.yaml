services:
  - type: web
    name: frontend-fashion-api
    runtime: node
    branch: feature/modern-ecommerce
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_SERVICE
        value: gmail
      - key: SHIPPING_FEE
        value: "0"
      - key: FREE_SHIPPING_THRESHOLD
        value: "0"
      - key: TAX_PERCENT
        value: "0"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
